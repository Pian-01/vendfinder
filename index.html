<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UT-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>VendFinder</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <nav>
            <h2>VendFinder</h2>
            <a href="https://discord.gg/thelostnemo" target="_blank" rel="noopener noreferrer">
    Growtopia Marketplace
</a>
        </nav>
        <main>
            <h1>Find Item</h1>
            <div class="search-box search-container">
              <input
               type="text"
              id="searchInput"
                placeholder="Cari nama atau ID item..."
              >

             <div id="itemSuggestions" class="suggestions"></div>

             <button id="searchButton">Search</button>
            </div>
             <div class="results-container">
             <h3 class="results-title">Search Results</h3>

             <div class="filter-container">

    <input
        type="text"
        id="worldSearch"
        placeholder="Cari nama world..."
    >

    <select id="sortFilter">
        <option value="default">Urutan: Terbaru</option>
        <option value="cheapest">Termurah</option>
        <option value="expensive">Termahal</option>
    </select>

    <select id="accessFilter">
        <option value="all">Semua Vending</option>
        <option value="accessible">Accessible</option>
        <option value="restricted">Akses Terbatas</option>
    </select>

</div>
         </div>

         <div id="resultList"></div>
        </div>
            </section>
            </main>
        <footer>
            VendFinder © 2026
        </footer>
        </main>
         <script src="script.js"></script>
    </body>
</html>
