<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UT-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>VendFinder</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <nav>
            <h2>VendFinder</h2>
            <a href="https://discord.gg/thelostnemo" target="_blank" rel="noopener noreferrer">
    Growtopia Marketplace
</a>
        </nav>
        <main>
            <h1>Find Item</h1>
            <div class="search-box">
                <input  type="text" 
                        id="searchInput"
                        placeholder="Search item name or ID">
                <button id="searchButton">Search</button>
            </div>
            <section class="results">
                <h3>Search Results</h3>
                 <div id="resultList">
                     <p class="empty">Search an item to see available listings.</p>
                 </div>
            </section>
        </main>
        <footer>
            VendFinder © 2026
        </footer>
        </main>
         <script src="script.js"></script>
    </body>
</html>
